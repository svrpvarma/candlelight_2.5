# Builds qtcandlelightfdcanbus.dll with the same toolchain as the official
# SavvyCAN Windows build (Qt 6.10, MSVC 2022, x64) - a plugin only loads into
# a SavvyCAN built with the same Qt major/minor version and compiler.
name: Build Windows plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Install Qt (same as SavvyCAN's CI)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10'
          modules: 'qtserialbus'

      - uses: actions/checkout@v4

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 2

      - name: Package
        shell: pwsh
        run: |
          mkdir package
          Get-ChildItem build -Recurse -Filter qtcandlelightfdcanbus.dll | Copy-Item -Destination package/
          copy qtcandlelightfd.ini package/
          copy README.md package/

      - uses: actions/upload-artifact@v4
        with:
          name: qtcandlelightfdcanbus-qt6.10-msvc2022-x64
          path: package/
