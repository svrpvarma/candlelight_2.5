# Builds qtcandlelightfdcanbus.dll for both SavvyCAN toolchains:
#   qt5  - SavvyCAN V213 / V220 releases   (Qt 5.15.2, MSVC 2019 x64)
#   qt6  - SavvyCAN Qt6 development builds (Qt 6.10,   MSVC 2022 x64)
# A Qt plugin only loads into a SavvyCAN built with the same Qt version and compiler.
name: Build Windows plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qt5.15.2-msvc2019-x64
            qt: '5.15.2'
            arch: win64_msvc2019_64
            modules: ''
            toolset: v142
          - name: qt6.10-msvc2022-x64
            qt: '6.10'
            arch: win64_msvc2022_64
            modules: 'qtserialbus'
            toolset: ''
    name: ${{ matrix.name }}
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          modules: ${{ matrix.modules }}

      - uses: actions/checkout@v5

      # Compiler errors are re-emitted as ::error annotations so they show on the
      # run summary page (and via the API) without opening the raw log.
      - name: Compile
        shell: pwsh
        run: |
          function Fail($log) {
            Get-Content $log | Select-String -Pattern '(error|Error)[ :]' | Select-Object -First 15 |
              ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit 1
          }
          $ts = @()
          if ("${{ matrix.toolset }}") { $ts = @("-T", "${{ matrix.toolset }}") }
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 @ts 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0 -and $ts.Count -gt 0) {
            Write-Output "::warning::Toolset ${{ matrix.toolset }} not available, using the default MSVC toolset"
            Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
            cmake -B build -S . -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object configure.log
          }
          if ($LASTEXITCODE -ne 0) { Fail configure.log }
          cmake --build build --config Release -j 2 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { Fail build.log }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Get-ChildItem build -Recurse -Filter qtcandlelightfdcanbus.dll | Copy-Item -Destination package/
          Copy-Item qtcandlelightfd.ini, README.md package/

      - uses: actions/upload-artifact@v4
        with:
          name: qtcandlelightfdcanbus-${{ matrix.name }}
          path: package/
