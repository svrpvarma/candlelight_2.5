; Optional settings for qtcandlelightfdcanbus.dll
; Copy next to the DLL (SavvyCAN\canbus\qtcandlelightfd.ini).
; Nominal bitrate, CAN FD on/off and listen-only come from SavvyCAN's connection settings.

[timing]
; Sample points in percent. They MUST match the other nodes on the bus -
; for CAN FD a mismatch causes error frames / bus-off.
NominalSamplePoint=87.5
DataSamplePoint=75.0

[bus]
; CAN FD data-phase bitrate. SavvyCAN V213/V220 (Qt5) do not pass a data rate
; to the plugin, so it is taken from here. Qt6 SavvyCAN's setting overrides it.
DataBitrate=2000000
; Bit rate switch for frames longer than 8 bytes that SavvyCAN sends without FD flag
BitrateSwitch=true
; Open in CAN FD mode even if "CAN FD" is not ticked in SavvyCAN
ForceFD=false
